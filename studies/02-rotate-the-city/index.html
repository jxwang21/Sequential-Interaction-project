<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Rotate the city</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300&display=swap">
<style>
/* Layout concept: a flat dark canvas. A large square scene holds the upside-down city (two wings of connected buildings) turning around a fixed centre, with the doorway standing upright in the clear gap at that centre. The route clue, progress dots, direction pad and reset button sit below the city; on wide screens they line up in one row. Everything sizes from one unit (--u). Every stroke is 1.5px in screen pixels. */
:root {
  --bg: #121212;
  --panel: #1d1d1d;
  --panel-in: #161616;
  --niche: #0d0d0d;
  --line: #9a9a9a;
  --line-hi: #cfcfcf;
  --line-dim: #5e5e5e;
  --lit: #dcdcdc;
  --bright: #efefef;
  --bevel-hi: #565656;
  --bevel-lo: #060606;
  --shade: #000000;
  --u: min(calc((100vw - 32px) / 12.1), calc((100svh - 92px) / 28), 34px);
  color-scheme: dark;
}
@media (min-aspect-ratio: 5/4) {
  :root { --u: min(calc((100vw - 76px) / 21), calc((100svh - 60px) / 19.1), 34px); }
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--lit); }

.stage {
  box-sizing: border-box;
  height: 100%;
  padding-inline: 16px;
  padding-block: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: calc(var(--u) * 1.2);
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
}
.controls {
  flex: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: calc(var(--u) * 1.2);
}
.clues { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 1.2); flex: none; }
@media (min-aspect-ratio: 5/4) {
  .controls { flex-direction: row; gap: calc(var(--u) * 2); }
}

svg { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; display: block; }
svg * { vector-effect: non-scaling-stroke; }

/* ---------- scene ---------- */
.scene { position: relative; flex: none; width: calc(var(--u) * 12); height: calc(var(--u) * 12); }

.city {
  --a: 0deg;
  --dur: 900ms;
  --ease: cubic-bezier(.55, 0, .3, 1);
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
  transform: rotate(var(--a));
  transition: transform var(--dur) var(--ease), opacity .3s ease;
  will-change: transform;
}
.city.dim { opacity: .5; }
.bld { fill: var(--panel); stroke: var(--line); }
.edge { stroke: var(--bevel-hi); }
.win { stroke: var(--line-dim); }

.door {
  position: absolute;
  inset: 0;
  margin: auto;
  width: calc(var(--u) * 3.27);
  aspect-ratio: 140 / 200;
  perspective: calc(var(--u) * 25);
}
.door svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.d-shadow { fill: var(--shade); stroke: none; opacity: .6; }
.d-outer { fill: var(--panel); stroke: var(--line); }
.d-hi { stroke: var(--bevel-hi); }
.d-lo { stroke: var(--bevel-lo); }
.d-open { fill: var(--niche); stroke: var(--line-dim); }
.moon { opacity: 0; transition: opacity .15s ease .45s; }
.moon text {
  fill: var(--lit);
  stroke: none;
  font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif;
  font-weight: 300;
  font-size: 15px;
  letter-spacing: 4px;
}
.door.open .moon { opacity: 1; transition: opacity 0s; }
.panel {
  transform-origin: 24.3% 50%;
  transform: rotateY(0deg);
  transition: transform .6s ease-in-out;
  will-change: transform;
}
.door.open .panel { transform: rotateY(-104deg); transition: transform 1s cubic-bezier(.5, 0, .3, 1); }
.p-body { fill: var(--panel); stroke: var(--line); }

/* ---------- clue and dots ---------- */
.clue { width: calc(var(--u) * 8); height: auto; flex: none; }
.clue-plaque { fill: var(--panel); stroke: var(--line); }
.clue-plate { fill: var(--panel-in); stroke: var(--line-dim); }
.clue-step { stroke: var(--lit); }

.marks { width: calc(var(--u) * 5); height: auto; flex: none; }
.m-ring { fill: var(--panel); stroke: var(--line); }
.m-in { fill: var(--panel-in); stroke: var(--line-dim); }
.m-fill { fill: var(--lit); stroke: var(--lit); opacity: 0; transition: opacity .3s ease; }
.mark.on .m-fill { opacity: 1; transition: opacity .45s ease; }

/* ---------- direction pad ---------- */
.pad {
  flex: none;
  display: grid;
  grid-template-columns: repeat(3, calc(var(--u) * 2.8));
  gap: calc(var(--u) * .25);
}
.btn {
  --c-fill: var(--panel);
  --c-edge: var(--line);
  --c-plate: var(--panel-in);
  --c-hi: var(--bevel-hi);
  --c-lo: var(--bevel-lo);
  --c-arrow: var(--lit);
  appearance: none;
  background: none;
  border: 0;
  padding: 0;
  margin: 0;
  aspect-ratio: 1;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  outline: none;
}
.btn[data-dir="up"] { grid-column: 2; grid-row: 1; }
.btn[data-dir="left"] { grid-column: 1; grid-row: 2; }
.btn[data-dir="down"] { grid-column: 2; grid-row: 2; }
.btn[data-dir="right"] { grid-column: 3; grid-row: 2; }
.btn:focus-visible { outline: 1.5px solid var(--lit); outline-offset: 3px; }
.btn svg { width: 100%; height: 100%; overflow: visible; }
.stage.is-locked .btn { cursor: default; }

.b-shadow { fill: var(--shade); stroke: none; opacity: .6; transition: opacity .3s ease; }
.b-body { transition: transform .3s ease-in-out; }
.b-outer, .b-plate, .b-hi, .b-lo, .b-arrow { transition: fill .3s ease, stroke .3s ease; }
.b-outer { fill: var(--c-fill); stroke: var(--c-edge); }
.b-hi { stroke: var(--c-hi); }
.b-lo { stroke: var(--c-lo); }
.b-plate { fill: var(--c-plate); stroke: var(--line-dim); }
.b-arrow { stroke: var(--c-arrow); }

@media (hover: hover) {
  .stage:not(.is-locked) .btn:hover { --c-edge: var(--line-hi); }
}
/* order: ok, down, err */
.btn.ok { --c-edge: var(--bright); --c-arrow: var(--bright); }
.btn.down { --c-edge: var(--bright); --c-arrow: var(--bright); }
.btn.down .b-outer, .btn.down .b-arrow { transition: fill .08s ease, stroke .08s ease; }
.btn.down .b-body { transform: translate(1.5px, 2px); transition: transform .2s ease-out; }
.btn.down .b-shadow { opacity: .3; transition: opacity .2s ease-out; }
.btn.err { --c-fill: #0b0b0b; --c-plate: #090909; --c-edge: #474747; --c-hi: #0b0b0b; --c-lo: #0b0b0b; --c-arrow: #4a4a4a; }
.btn.err .b-outer, .btn.err .b-plate, .btn.err .b-arrow { transition: fill .1s ease, stroke .1s ease; }
.btn.err .b-body { transform: translate(1.5px, 2px); transition: transform .2s ease-out; }
.btn.err .b-shadow { opacity: .3; }

/* ---------- reset ---------- */
.reset {
  flex: none;
  width: 44px;
  height: 44px;
  padding: 0;
  display: grid;
  place-items: center;
  background: var(--panel);
  border: 1.5px solid var(--line-dim);
  border-radius: 50%;
  box-shadow: 0 2px 0 var(--shade);
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: transform .15s ease-out, box-shadow .15s ease-out, border-color .15s ease;
}
.reset svg { width: 22px; height: 22px; stroke: var(--line); }
@media (hover: hover) { .reset:hover { border-color: var(--line-hi); } }
.reset:active { transform: translateY(2px); box-shadow: 0 0 0 var(--shade); }
.reset:focus-visible { outline: 1.5px solid var(--lit); outline-offset: 3px; }

@media (prefers-reduced-motion: reduce) {
  .city { transition-duration: .01s !important; }
  .panel, .door.open .panel, .moon, .door.open .moon, .m-fill, .mark.on .m-fill,
  .b-body, .btn.down .b-body, .btn.err .b-body, .b-outer, .b-arrow { transition-duration: .01s !important; transition-delay: 0s !important; }
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="soft-sm" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter>
    <filter id="soft-md" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
</svg>

<main class="stage" id="stage" aria-label="Rotate the city">
  <div class="scene">
    <!-- One rigid group, pivoting on the centre of the scene (180, 180). Roofs point down. Both wings keep clear of the doorway at every angle. -->
    <svg class="city" id="city" viewBox="0 0 360 360" aria-hidden="true">
      <g id="buildings">
        <polygon class="bld" points="20,130 42,130 42,210 31,232 20,210"/>
        <polygon class="bld" points="42,130 66,130 66,246 42,226"/>
        <polygon class="bld" points="66,130 84,130 84,194 75,208 66,194"/>
        <polygon class="bld" points="84,130 104,130 104,226 96,226 96,240 90,240 90,226 84,226"/>
        <polygon class="bld" points="256,130 280,130 280,220 268,236 256,220"/>
        <polygon class="bld" points="280,130 306,130 306,254 280,254"/>
        <polygon class="bld" points="306,130 324,130 324,200 315,216 306,200"/>
        <polygon class="bld" points="324,130 340,130 340,216 324,236"/>
      </g>
      <g id="edge-light">
        <path class="edge" d="M23 133 H39"/>
        <path class="edge" d="M45 133 H63"/>
        <path class="edge" d="M69 133 H81"/>
        <path class="edge" d="M87 133 H101"/>
        <path class="edge" d="M259 133 H277"/>
        <path class="edge" d="M283 133 H303"/>
        <path class="edge" d="M309 133 H321"/>
        <path class="edge" d="M327 133 H337"/>
      </g>
      <g id="windows">
        <rect class="win" x="28" y="140" width="5" height="7"/>
        <rect class="win" x="46" y="140" width="5" height="7"/>
        <rect class="win" x="55" y="152" width="5" height="7"/>
        <rect class="win" x="91" y="140" width="5" height="7"/>
        <rect class="win" x="265" y="140" width="5" height="7"/>
        <rect class="win" x="287" y="140" width="5" height="7"/>
        <rect class="win" x="296" y="152" width="5" height="7"/>
        <rect class="win" x="329" y="140" width="5" height="7"/>
      </g>
    </svg>

    <div class="door" id="door" role="img" aria-label="Doorway">
      <svg viewBox="0 0 140 200" aria-hidden="true">
        <rect class="d-shadow" x="24" y="19" width="100" height="172" rx="2" filter="url(#soft-md)"/>
        <g id="door-frame">
          <rect class="d-outer" x="20" y="14" width="100" height="172" rx="2"/>
          <path class="d-hi" d="M24 182 V18 H116"/>
          <path class="d-lo" d="M116 18 V182 H24"/>
          <rect class="d-open" x="32" y="26" width="76" height="148"/>
        </g>
      </svg>
      <svg class="moon" id="moon" viewBox="0 0 140 200" aria-hidden="true">
        <text x="72" y="100" text-anchor="middle" dominant-baseline="central">MOON</text>
      </svg>
      <svg class="panel" viewBox="0 0 140 200" aria-hidden="true">
        <g id="door-panel">
          <rect class="p-body" x="34" y="28" width="72" height="144"/>
          <path class="d-hi" d="M37 169 V31 H103"/>
          <path class="d-lo" d="M103 31 V169 H37"/>
        </g>
      </svg>
    </div>
  </div>

  <div class="controls">
    <div class="clues">
      <svg class="clue" viewBox="0 0 272 96" role="img" aria-label="Route clue">
        <rect class="clue-plaque" x="6" y="6" width="260" height="84" rx="3"/>
        <path class="d-hi" d="M9 87 V9 H263"/>
        <path class="d-lo" d="M263 9 V87 H9"/>
        <rect class="clue-plate" x="15" y="15" width="242" height="66" rx="2"/>
        <g class="clue-step">
          <path d="M0 16 V-16 M-11 -5 L0 -16 L11 -5" transform="translate(46 48) rotate(0)"/>
          <path d="M0 16 V-16 M-11 -5 L0 -16 L11 -5" transform="translate(106 48) rotate(90)"/>
          <path d="M0 16 V-16 M-11 -5 L0 -16 L11 -5" transform="translate(166 48) rotate(180)"/>
          <path d="M0 16 V-16 M-11 -5 L0 -16 L11 -5" transform="translate(226 48) rotate(270)"/>
        </g>
      </svg>

      <svg class="marks" viewBox="0 0 180 48" aria-hidden="true">
        <g class="mark"><circle class="m-ring" cx="24" cy="24" r="12"/><circle class="m-in" cx="24" cy="24" r="8"/><circle class="m-fill" cx="24" cy="24" r="8"/></g>
        <g class="mark"><circle class="m-ring" cx="68" cy="24" r="12"/><circle class="m-in" cx="68" cy="24" r="8"/><circle class="m-fill" cx="68" cy="24" r="8"/></g>
        <g class="mark"><circle class="m-ring" cx="112" cy="24" r="12"/><circle class="m-in" cx="112" cy="24" r="8"/><circle class="m-fill" cx="112" cy="24" r="8"/></g>
        <g class="mark"><circle class="m-ring" cx="156" cy="24" r="12"/><circle class="m-in" cx="156" cy="24" r="8"/><circle class="m-fill" cx="156" cy="24" r="8"/></g>
      </svg>
    </div>

    <div class="pad" id="pad"></div>

    <button class="reset" id="reset" type="button" aria-label="Reset">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
    </button>
  </div>
</main>

<script>
(function () {
  var SEQ = ['up', 'right', 'down', 'left'];
  var ROT = { up: 0, right: 90, down: 180, left: 270 };
  var LABEL = { up: 'Up', right: 'Right', down: 'Down', left: 'Left' };
  var PAD_ORDER = ['up', 'left', 'down', 'right'];
  var STEP_MS = 900;       // one 15 degree turn
  var RETURN_MS = 1600;    // slow return after a wrong input
  var HEAVY = 'cubic-bezier(.55,0,.3,1)';      // slow start, firmer middle, gradual stop
  var CONTROLLED = 'cubic-bezier(.45,0,.25,1)';

  var stage = document.getElementById('stage');
  var city = document.getElementById('city');
  var door = document.getElementById('door');
  var moon = document.getElementById('moon');
  var pad = document.getElementById('pad');
  var marks = Array.prototype.slice.call(document.querySelectorAll('.mark'));
  var buttons = [];
  var step = 0, locked = false, pressing = null, timers = [];

  function buttonSvg(dir) {
    return '<svg viewBox="0 0 96 96" aria-hidden="true">' +
      '<rect class="b-shadow" x="11" y="12" width="76" height="76" rx="3" filter="url(#soft-sm)"/>' +
      '<g class="b-body">' +
      '<rect class="b-outer" x="6" y="6" width="76" height="76" rx="3"/>' +
      '<path class="b-hi" d="M9 79 V9 H79"/>' +
      '<path class="b-lo" d="M79 9 V79 H9"/>' +
      '<rect class="b-plate" x="15" y="15" width="58" height="58" rx="2"/>' +
      '<path class="b-arrow" d="M0 16 V-16 M-11 -5 L0 -16 L11 -5" transform="translate(44 44) rotate(' + ROT[dir] + ')"/>' +
      '</g></svg>';
  }

  PAD_ORDER.forEach(function (dir) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn';
    b.setAttribute('data-dir', dir);
    b.setAttribute('aria-label', LABEL[dir]);
    b.innerHTML = buttonSvg(dir);
    pad.appendChild(b);
    buttons.push(b);
    wire(b, dir);
  });

  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function setLocked(v) { locked = v; stage.classList.toggle('is-locked', v); }

  function rotateCity(deg, ms, ease) {
    city.style.setProperty('--dur', ms + 'ms');
    city.style.setProperty('--ease', ease);
    city.style.setProperty('--a', deg + 'deg');
  }

  function inside(el, x, y) {
    var r = el.getBoundingClientRect();
    return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
  }

  function wire(el, dir) {
    el.addEventListener('pointerdown', function (e) {
      if (locked || pressing) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      pressing = { el: el, id: e.pointerId };
      el.classList.add('down');
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
    });
    el.addEventListener('pointermove', function (e) {
      if (!pressing || pressing.el !== el || pressing.id !== e.pointerId) return;
      el.classList.toggle('down', inside(el, e.clientX, e.clientY));
    });
    el.addEventListener('pointerup', function (e) {
      if (!pressing || pressing.el !== el || pressing.id !== e.pointerId) return;
      var ok = inside(el, e.clientX, e.clientY);
      el.classList.remove('down');
      pressing = null;
      if (ok) choose(dir, el);
    });
    el.addEventListener('pointercancel', cancelPress);
    el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    el.addEventListener('keydown', function (e) {
      if ((e.key === 'Enter' || e.key === ' ') && !e.repeat) {
        e.preventDefault();
        if (locked || pressing) return;
        pressing = { el: el, id: 'key' };
        el.classList.add('down');
      }
    });
    el.addEventListener('keyup', function (e) {
      if ((e.key === 'Enter' || e.key === ' ') && pressing && pressing.el === el && pressing.id === 'key') {
        e.preventDefault();
        el.classList.remove('down');
        pressing = null;
        choose(dir, el);
      }
    });
    el.addEventListener('blur', function () {
      if (pressing && pressing.el === el && pressing.id === 'key') cancelPress();
    });
  }

  function cancelPress() {
    if (pressing) { pressing.el.classList.remove('down'); pressing = null; }
  }

  function choose(dir, el) {
    if (locked) return;
    if (dir === SEQ[step]) {
      setLocked(true);
      step++;
      var n = step;
      el.classList.add('ok');
      rotateCity(n * 15, STEP_MS, HEAVY);
      later(function () {
        el.classList.remove('ok');
        marks[n - 1].classList.add('on');   // fill only after the city has stopped
        if (n === SEQ.length) {
          later(function () {
            door.classList.add('open');
            moon.setAttribute('aria-hidden', 'false');
          }, 400); // the study ends here; input stays disabled until reset
        } else {
          setLocked(false);
        }
      }, STEP_MS);
    } else {
      setLocked(true);
      el.classList.add('err');
      later(function () {
        el.classList.remove('err');
        marks.forEach(function (m) { m.classList.remove('on'); });
        step = 0;
        city.classList.add('dim');
        rotateCity(0, RETURN_MS, CONTROLLED);
        later(function () {
          city.classList.remove('dim');
          setLocked(false);
        }, RETURN_MS);
      }, 300);
    }
  }

  function reset() {
    timers.forEach(clearTimeout);
    timers = [];
    cancelPress();
    step = 0;
    setLocked(false);
    buttons.forEach(function (b) { b.classList.remove('down', 'err', 'ok'); });
    marks.forEach(function (m) { m.classList.remove('on'); });
    city.classList.remove('dim');
    door.classList.remove('open');
    moon.setAttribute('aria-hidden', 'true');
    rotateCity(0, 700, CONTROLLED);
  }

  moon.setAttribute('aria-hidden', 'true');
  document.getElementById('reset').addEventListener('click', reset);
})();
</script>

</body></html>
